<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bevora</title>
<style>
  :root { --bg:#FFF8F0; --card:#ffffff; --text:#2A1E2F; --muted:#6E6272; --green:#23885F; --red:#C62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1B1420; --card:#2C2233; --text:#F7EEE6; --muted:#BFB2C2; --green:#5FD3A2; --red:#ef9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); padding:16px;
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; max-width:420px; width:100%;
          text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .logo { display:block; margin:0 auto 16px; }
  .icon { font-size:48px; margin:8px 0; }
  h1 { font-size:22px; margin:8px 0 12px; }
  p { color:var(--muted); line-height:1.5; margin:8px 0; }
  .ok h1 { color:var(--green); } .err h1 { color:var(--red); }
  small { display:block; margin-top:24px; color:var(--muted); }
</style>
</head>
<body>
<main class="card" id="box">
  <svg class="logo" width="64" height="64" viewBox="0 0 40 40" aria-hidden="true" style="display:block;margin:0 auto 16px"><rect width="40" height="40" rx="12" fill="#F2613F"/><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/><path d="M20 9 A11 11 0 1 1 9 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg>
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Einen Moment …</h1>
  <p id="text"></p>
  <small>Bevora · <a href="datenschutz.html" style="color:inherit">Datenschutz</a> · <a href="nutzungsbedingungen.html" style="color:inherit">Nutzungsbedingungen</a></small>
</main>
<script>
  // Supabase hat den Link schon geprüft und leitet hierher weiter.
  // Erfolg: ?code=… oder #access_token=… · Fehler: #error=…&error_code=…
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var err = q.get('error') || h.get('error');
  var errCode = q.get('error_code') || h.get('error_code') || '';
  var success = !err && (q.get('code') || h.get('access_token') || h.get('type'));
  // Codes und Schlüssel nicht in der Adresszeile stehen lassen.
  if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  function show(cls, icon, title, text) {
    document.getElementById('box').className = 'card ' + cls;
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('text').textContent = text;
  }
  if (err) {
    var expired = /expired|otp/i.test(errCode + ' ' + (q.get('error_description') || h.get('error_description') || ''));
    show('err', '⚠️',
      expired ? 'Link abgelaufen oder schon benutzt' : 'Das hat nicht geklappt',
      'Hast du schon einmal auf den Link getippt, ist deine Adresse bereits bestätigt – dann einfach in der Bevora-App einloggen. ' +
      'Sonst in der App mit E-Mail und Passwort einloggen und auf „Code senden“ tippen.');
  } else if (success) {
    show('ok', '✅', 'E-Mail-Adresse bestätigt',
      'Super! Du kannst diese Seite schließen und zurück in die Bevora-App wechseln – dort wirst du automatisch angemeldet. Falls nicht: mit E-Mail-Adresse und Passwort einloggen.');
  } else {
    show('', '⏳', 'Bevora',
      'Der gemeinsame Vorrat für deinen Haushalt. Diese Seite bestätigt E-Mail-Adressen für die Bevora-App.');
  }
</script>
</body>
</html>
